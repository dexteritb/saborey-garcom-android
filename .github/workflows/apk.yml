# Monta o APK do app do garçom a cada envio (e quando pedido em Actions → "Run workflow").
# O APK fica para baixar em Actions → (última execução) → Artifacts.
name: Montar APK
on:
  push:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Montar APK de teste (debug)
        run: chmod +x gradlew && ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: saborey-garcom-debug-apk
          path: app/build/outputs/apk/debug/*.apk
